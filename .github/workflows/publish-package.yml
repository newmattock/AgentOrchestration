name: Publish Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish from the checked-out ref
        required: true
        type: string
      dry_run:
        description: Build and verify without publishing to the registry
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify protected publish ref
        id: ref_guard
        env:
          GH_TOKEN: ${{ github.token }}
          ACTUAL_REF_NAME: ${{ github.ref_name }}
          ACTUAL_REF_TYPE: ${{ github.ref_type }}
          ACTUAL_REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail

          if [ "${ACTUAL_REF_TYPE}" = "branch" ]; then
            if [ "${ACTUAL_REF_PROTECTED}" != "true" ]; then
              echo "::error::Package publishing must run from a protected branch or a verified signed tag."
              exit 64
            fi
            case "${ACTUAL_REF_NAME}" in
              main|release/*)
                ;;
              *)
                echo "::error::Package publishing branches must be main or release/*."
                exit 65
                ;;
            esac

            echo "publish_ref_kind=protected-branch" >> "${GITHUB_OUTPUT}"
            echo "publish_allowed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ "${ACTUAL_REF_TYPE}" = "tag" ]; then
            if [[ ! "${ACTUAL_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
              echo "::error::Package publishing tags must match vMAJOR.MINOR.PATCH release tag policy."
              exit 66
            fi

            tag_object_type="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${ACTUAL_REF_NAME}" --jq '.object.type')"
            tag_object_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${ACTUAL_REF_NAME}" --jq '.object.sha')"

            if [ "${tag_object_type}" != "tag" ]; then
              echo "::error::Package publishing tags must be annotated signed tags, not lightweight tags."
              exit 67
            fi

            tag_verified="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" --jq '.verification.verified')"
            if [ "${tag_verified}" != "true" ]; then
              echo "::error::Package publishing tag ${ACTUAL_REF_NAME} is not verified as signed."
              exit 68
            fi

            echo "publish_ref_kind=signed-tag" >> "${GITHUB_OUTPUT}"
            echo "publish_allowed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "::error::Package publishing only supports protected branches and signed tags."
          exit 69

      - name: Set up Python
        if: steps.ref_guard.outputs.publish_allowed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        if: steps.ref_guard.outputs.publish_allowed == 'true'
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        if: steps.ref_guard.outputs.publish_allowed == 'true'
        run: uv sync

      - name: Run release tests
        if: steps.ref_guard.outputs.publish_allowed == 'true'
        run: uv run pytest tests/ -q

      - name: Build package
        if: steps.ref_guard.outputs.publish_allowed == 'true'
        run: uv build

      - name: Publish package
        if: >-
          steps.ref_guard.outputs.publish_allowed == 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish
